title: "Akash Sharma"
tagline: "systems · security · ai"
description: >-
  Notes from building planet-scale distributed systems, security, and AI.
url: "https://sharmaakash.com"
baseurl: ""
lang: en
theme: null # the github-pages gem otherwise injects jekyll-theme-primer

author:
  name: Akash Sharma
  github: akashs-india
  linkedin: akash-sharma-4b9375140

# shell prompt used across the site
prompt_user: akash
prompt_host: sharma

permalink: /blogs/:year/:title/
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  auto_ids: true

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "" }
    values: { layout: page }

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .jekyll-cache
