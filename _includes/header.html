<header class="site-header">
  <a class="brand" href="{{ '/' | relative_url }}" aria-label="Home">
    <span class="brand-prompt">~/</span>{{ site.prompt_user }}<span class="cursor" aria-hidden="true"></span>
  </a>
  <nav class="site-nav" aria-label="Primary">
    {%- assign p = page.url -%}
    <a href="{{ '/blogs/' | relative_url }}"{% if p contains '/blogs/' or page.layout == 'post' %} aria-current="page"{% endif %}>./blogs</a>
    <a href="{{ '/about/' | relative_url }}"{% if p == '/about/' %} aria-current="page"{% endif %}>./about</a>
  </nav>
</header>
